<!doctype html>
<html lang="th">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
		/>
		<meta name="text-scale" content="scale" />

		<!-- Web App & PWA Meta Tags -->
		<title>HourWorked - คำนวณชั่วโมงทำงาน & บันทึกเวลา</title>
		<meta name="description" content="แอปบันทึกเวลาทำงาน คำนวณค่าจ้างตามจริงและล่วงเวลาสำหรับชาวฟรีแลนซ์และพาร์ตไทม์" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="HourWorked" />
		<meta name="application-name" content="HourWorked" />
		<meta name="format-detection" content="telephone=no" />

		<!-- Theme Color for iOS Safari & Android Chrome -->
		<meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

		<!-- PWA Manifest & Icons -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" type="image/svg+xml" href="/icon.svg" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />

		<!-- Google Fonts: Geist, Geist Mono, Outfit & Prompt for Modern FinTech Editorial -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Geist+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
			rel="stylesheet"
		/>

		%sveltekit.head%
	</head>
	<body class="bg-[#f4f4f5] text-zinc-900 antialiased dark:bg-[#09090b] dark:text-zinc-100 select-none min-h-[100dvh]">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
