<!doctype html>
<html lang="th">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
		/>
		<meta name="text-scale" content="scale" />

		<!-- Web App & PWA Meta Tags -->
		<title>HourWorked - คำนวณชั่วโมงทำงาน & บันทึกเวลา</title>
		<meta name="description" content="แอปบันทึกเวลาทำงาน คำนวณค่าจ้างตามจริงและล่วงเวลาสำหรับชาวฟรีแลนซ์และพาร์ตไทม์" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="HourWorked" />
		<meta name="application-name" content="HourWorked" />
		<meta name="format-detection" content="telephone=no" />

		<!-- Theme Color for iOS Safari & Android Chrome -->
		<meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />

		<!-- PWA Manifest & Icons -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" type="image/svg+xml" href="/icon.svg" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />

		<!-- Google Fonts: Prompt for modern Thai typography -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
			rel="stylesheet"
		/>

		%sveltekit.head%
	</head>
	<body class="bg-slate-100 text-slate-800 antialiased dark:bg-slate-950 dark:text-slate-100 select-none">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
