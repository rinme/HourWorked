<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Ambient Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="16" />
  
  <!-- Active Progress Arc -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#accentGrad)" stroke-width="16"
          stroke-linecap="round" stroke-dasharray="1068" stroke-dashoffset="350" />

  <!-- Inner Clock Body with shadow -->
  <circle cx="256" cy="256" r="130" fill="#1e293b" filter="url(#shadow)" />

  <!-- Clock Hour Ticks -->
  <circle cx="256" cy="156" r="5" fill="#94a3b8" />
  <circle cx="356" cy="256" r="5" fill="#94a3b8" />
  <circle cx="256" cy="356" r="5" fill="#94a3b8" />
  <circle cx="156" cy="256" r="5" fill="#94a3b8" />

  <!-- Clock Hands -->
  <!-- Hour hand pointing at ~10 o'clock -->
  <line x1="256" y1="256" x2="204" y2="204" stroke="#f8fafc" stroke-width="12" stroke-linecap="round" />
  <!-- Minute hand pointing at 2 o'clock -->
  <line x1="256" y1="256" x2="310" y2="175" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" />
  <!-- Center Pin -->
  <circle cx="256" cy="256" r="14" fill="#38bdf8" />
  <circle cx="256" cy="256" r="6" fill="#f8fafc" />

  <!-- Bottom Badge: Mini Currency Sparkle (฿) -->
  <g transform="translate(320, 320)">
    <circle cx="24" cy="24" r="28" fill="url(#accentGrad)" filter="url(#shadow)" />
    <text x="24" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="24" font-weight="bold" fill="#0f172a" text-anchor="middle">฿</text>
  </g>
</svg>
